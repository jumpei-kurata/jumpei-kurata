name: Update Languages Card

on:
  schedule:
    - cron: '30 22 * * *'  # Daily, after the podcast update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-langs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Stats + languages cards that include private repos
      # https://github.com/jumpei-kurata/private-stats-cards
      - uses: jumpei-kurata/private-stats-cards@v1
        with:
          token: ${{ secrets.LANGS_TOKEN }}
          output-dir: assets
          hide-languages: HTML,CSS,VBA,Rich Text Format,SCSS,Jupyter Notebook,Dockerfile,Makefile,Procfile,Batchfile,Roff
          commit-message: "chore: update languages and stats cards"
